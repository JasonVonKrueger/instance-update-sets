name: Copilot PR Review
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Run Copilot Review
        uses: github/copilot-review@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
