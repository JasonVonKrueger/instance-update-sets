name: Code Scanner + Copilot Review

on:
  # push:
  #   branches: [main]
  pull_request:
    branches: [main]
  # workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # gitleaks:
  #   # ... existing gitleaks job ...

  # update-set-scan:
  #   # ... existing update-set-scan job ...

  copilot-review:
    name: Copilot AI Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR details
        id: pr
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Request Copilot Review
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@copilot review this pull request with focus on:\n- Security\n- Code quality\n- Documentation\n- ServiceNow best practices'
            });
