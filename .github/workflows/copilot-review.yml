name: Copilot Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  copilot-review:
    # Avoid drafts; Copilot review is most useful when PR is ready
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --comment --body "@copilot review this pull request with focus on:
          - Security
          - Code quality
          - Documentation
          - ServiceNow best practices"
