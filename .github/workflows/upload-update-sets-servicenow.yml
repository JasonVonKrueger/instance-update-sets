name: Upload update sets to ServiceNow

on:
  push:
    branches:
      - main
    paths:
      - "update-sets/**/*.xml"

jobs:
  scan-update-set:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.scan.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Scan changed XML files for secrets
        id: scan
        run: |
          BEFORE_SHA="${{ github.event.before }}"

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid before-SHA (first commit on branch) — falling back to HEAD~1"
            BEFORE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          if [ -z "$BEFORE_SHA" ]; then
            echo "No comparison point available - scanning all XML files"
            CHANGED_FILES=$(find update-sets -name '*.xml' 2>/dev/null)
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" -- 'update-sets/' 2>/dev/null | grep '\.xml$' || true)
            if [ -z "$CHANGED_FILES" ]; then
              echo "git diff against $BEFORE_SHA produced nothing usable — scanning all XML files as fallback"
              CHANGED_FILES=$(find update-sets -name '*.xml' 2>/dev/null)
            fi
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No update set XML files changed - nothing to scan"
            echo "changed_files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Scanning changed files:"
          printf '%s\n' "$CHANGED_FILES"

          SQUOTE="'"
          SCAN_FAILED=0

          # newline-safe loop — handles filenames with spaces (e.g. "G.U.S.S. v2.1.xml")
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "=== Scanning $file ==="
            if grep -iE "(password|secret|token|api_key)\s*=\s*[\"${SQUOTE}][^\"${SQUOTE}]{4,}" "$file"; then
              echo "FAILED: Possible hardcoded credentials found in $file"
              SCAN_FAILED=1
            else
              echo "PASSED: $file"
            fi
          done <<< "$CHANGED_FILES"

          if [ "$SCAN_FAILED" -eq 1 ]; then
            echo "Secret scan failed — aborting"
            exit 1
          fi

          printf '%s\n' "$CHANGED_FILES" > changed_files.txt
          {
            echo "changed_files<<EOF"
            cat changed_files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload changed file list as artifact
        if: steps.scan.outputs.changed_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: changed-update-sets
          path: |
            changed_files.txt
            update-sets/*.xml
          if-no-files-found: warn

  upload-to-servicenow:
    needs: scan-update-set
    if: needs.scan-update-set.outputs.changed_files != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download changed file list
        uses: actions/download-artifact@v4
        with:
          name: changed-update-sets

      - name: Upload update sets to ServiceNow
        env:
          SN_TARGET_INSTANCE: ${{ secrets.TEST_INSTANCE_URL }}
          SN_USERNAME: ${{ secrets.TEST_USERNAME }}
          SN_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if [ ! -f changed_files.txt ] || [ ! -s changed_files.txt ]; then
            echo "No changed_files.txt (or it's empty) — nothing to upload"
            exit 0
          fi

          # newline-safe loop — handles filenames with spaces
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "=== Uploading $FILE ==="
            if [ ! -f "$FILE" ]; then
              echo "ERROR: $FILE not found"
              exit 1
            fi

            HTTP_CODE=$(curl -s -o /tmp/sn_response.txt -w "%{http_code}" -X POST \
              -u "$SN_USERNAME:$SN_PASSWORD" \
              -H "Content-Type: application/xml" \
              --data-binary "@$FILE" \
              "$SN_TARGET_INSTANCE/api/global/update_set_processor/import")

            echo "Response: $(cat /tmp/sn_response.txt)"
            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -gt 299 ]; then
              echo "ERROR: Upload failed with HTTP $HTTP_CODE"
              exit 1
            fi

            echo "Uploaded $FILE successfully"
          done < changed_files.txt
