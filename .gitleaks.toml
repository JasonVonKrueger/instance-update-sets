title = "Gitleaks Configuration"

[extend]
# Extend the default gitleaks ruleset so all built-in rules remain active.
useDefault = true

[allowlist]
description = "Allow ServiceNow sys_id values used as document keys in update-set XML files"
# ServiceNow update-set XML files use document_key / documentkey attributes to
# reference records by their sys_id, a 32-character hexadecimal identifier.
# These are internal record references, not secrets, and would otherwise
# trigger the generic-api-key rule.
#
# regexTarget = "match" ensures the regex is tested against the full matched
# string (e.g. `document_key=<hex32>`) rather than just the captured secret
# value (the bare hex string), which is the gitleaks v8 default behavior.
regexTarget = "match"
regexes = [
    '''document_key=[0-9a-f]{32}''',
    '''documentkey=[0-9a-f]{32}''',
]
